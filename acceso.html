<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso clientes — </title><meta name="robots" content="noindex"><style>
:root{--p:#0f766e;--ink:#0b1b2b;--mu:#5d6b7a;--bg:#f4f6f8;--line:#e3e8ee;--gold:#c28a2c}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{font:700 21px Georgia,serif}.brand i{font-style:normal;color:var(--p)}nav{display:flex;gap:22px;align-items:center}nav a{font-weight:600;color:var(--mu)}nav a:hover{color:var(--ink)}
.btn{background:var(--p);color:#fff!important;padding:10px 18px;border-radius:12px;font:700 15px inherit;border:0;cursor:pointer;display:inline-block;transition:transform .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0003}.btn.g{background:#fff;color:var(--ink)!important;border:1px solid var(--line)}
.hero{background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--p) 55%,var(--ink)));color:#fff;padding:64px 0 92px}.hero h1{font:700 clamp(30px,5vw,52px)/1.1 Georgia,serif;margin:0 0 12px;max-width:780px}.hero p{font-size:19px;opacity:.9;max-width:640px;margin:0 0 28px}
.search{background:#fff;border-radius:18px;padding:14px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:10px;box-shadow:0 24px 60px #0004;color:var(--ink)}.search input,.search select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}
.tabs{display:flex;gap:10px;margin:-30px 0 22px;position:relative}.tabs button{flex:1;max-width:260px;padding:14px 18px;border:0;border-radius:14px;background:#fff;font:700 16px inherit;cursor:pointer;box-shadow:0 8px 24px #0b1b2b14;color:var(--mu);transition:.2s}.tabs button.on{background:var(--p);color:#fff}.tabs b{opacity:.8;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:22px;margin-bottom:60px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 28px #0b1b2b12;cursor:pointer;transition:transform .25s,box-shadow .25s;animation:up .5s both}.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px #0b1b2b26}
.ph{position:relative;aspect-ratio:4/3;background:#dfe6ec}.ph img{width:100%;height:100%;object-fit:cover;display:block}.tg{position:absolute;top:12px;left:12px;background:var(--p);color:#fff;font:700 12px inherit;padding:5px 11px;border-radius:20px}.tg.d{left:auto;right:12px;background:var(--gold)}
.cb{padding:16px 18px 18px}.pr{font:700 23px Georgia,serif}.pr small{font:500 14px inherit;color:var(--mu)}.ti{font-weight:700;margin:2px 0}.lo{color:var(--mu);font-size:14px}.sp{display:flex;gap:14px;margin-top:10px;color:var(--mu);font-size:14px}
@keyframes up{from{opacity:0;transform:translateY(16px)}}#vacio{text-align:center;color:var(--mu);padding:50px 0}.nota{background:#fff;border-left:4px solid var(--p);border-radius:12px;padding:14px 18px;margin:0 0 22px}
dialog{border:0;border-radius:22px;padding:0;width:min(980px,94vw);max-height:92vh;overflow:auto;box-shadow:0 40px 100px #0008}dialog::backdrop{background:#0b1b2bcc;backdrop-filter:blur(4px)}
.dg{display:grid;grid-template-columns:1.25fr 1fr}.gal img.m{width:100%;height:100%;min-height:340px;max-height:560px;object-fit:cover;display:block}.th{display:flex;gap:6px;padding:8px;overflow:auto}.th img{width:74px;height:56px;object-fit:cover;border-radius:8px;cursor:pointer;opacity:.7}.th img.on{opacity:1;outline:2px solid var(--p)}
.di{padding:26px}.di h2{font:700 27px Georgia,serif;margin:0 0 4px}.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.sg div{background:var(--bg);border-radius:12px;padding:10px 12px}.sg b{display:block}.sg small{color:var(--mu)}
.x{position:absolute;top:14px;right:16px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;z-index:2;box-shadow:0 4px 14px #0004}
.ct{background:var(--ink);color:#fff;padding:60px 0;margin-top:20px}.ct .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:40px}.ct h2{font:700 30px Georgia,serif;margin:0 0 10px}.ct p{opacity:.85}footer{padding:22px 0;text-align:center;color:var(--mu);font-size:14px}
.ac{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--ink),color-mix(in srgb,var(--p) 50%,var(--ink)));padding:20px}.lg{background:#fff;border-radius:24px;padding:38px 34px;width:min(420px,100%);box-shadow:0 40px 100px #0006;text-align:center}.lg h1{font:700 28px Georgia,serif;margin:6px 0}.lg p{color:var(--mu)}.lg input{width:100%;padding:15px;border:1px solid var(--line);border-radius:14px;font:600 18px inherit;text-align:center;letter-spacing:.12em;margin:14px 0}.lg .btn{width:100%;padding:14px;font-size:16px}.er{color:#c0392b;min-height:22px;font-size:14px}
@media(max-width:820px){.search{grid-template-columns:1fr 1fr}.dg,.ct .wrap{grid-template-columns:1fr}nav a:not(.btn){display:none}}
</style></head><body><div class=ac><form class=lg onsubmit="return ir(event)"><div style="font-size:42px">🏠</div><h1>Mi inmobiliaria</h1><p>Zona de clientes. Escribe el código de acceso que te enviamos.</p><input id=cod placeholder="CÓDIGO" autocomplete=off autofocus><div class=er id=er></div><button class=btn>Entrar</button><p style="margin-top:18px"><a href="./" style="color:var(--p);font-weight:600">← Volver a las propiedades</a></p></form></div><script>async function ir(e){e.preventDefault();const c=document.querySelector("#cod").value.trim().toLowerCase().replace(/[^a-z0-9]/g,"");if(!c)return false;try{const r=await fetch("c/"+c+"/index.html");if(!r.ok)throw 0}catch(x){if(location.protocol!="file:"){document.querySelector("#er").textContent="Código no válido. Revísalo o pídelo de nuevo a tu asesor.";return false}}location="c/"+c+"/";return false}</script></body></html>
